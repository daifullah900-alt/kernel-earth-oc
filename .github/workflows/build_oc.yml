name: Build Safe Kernel OC Redmi 12C (Earth)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi bc flex bison make libssl-dev libelf-dev libyaml-dev zip unzip python3

      - name: Clone Source Kernel Cleanly
        run: |
          # Clone tanpa membawa submodule tua yang broken
          git clone --depth=1 https://github.com/mubashardev/android_kernel_xiaomi_earth_lineageos.git -b lineage-23.2 kernel-src
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          
          # Hapus sisa folder submodule jika ada & clone KernelSU resmi
          cd kernel-src
          rm -rf drivers/kernelsu
          git clone --depth=1 https://github.com/tiann/KernelSU.git drivers/kernelsu

      - name: Configure Performance Tweak
        run: |
          cd kernel-src
          echo "CONFIG_CPU_FREQ_GOV_PERFORMANCE=y" >> arch/arm64/configs/earth_defconfig
          echo "CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y" >> arch/arm64/configs/earth_defconfig

      - name: Build Kernel
        run: |
          cd kernel-src
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out earth_defconfig CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1
          make -j$(nproc --all) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1

      - name: Package AnyKernel3 ZIP
        run: |
          cd kernel-src
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb ../AK3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz ../AK3/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image ../AK3/
          fi

          cd ../AK3
          zip -r9 ../Kernel-SafeOC-Earth.zip * -x .git README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-SafeOC-Earth
          path: Kernel-SafeOC-Earth.zip
