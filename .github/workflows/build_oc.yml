name: Build Safe Kernel OC Redmi 12C (Earth)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi bc flex bison make libssl-dev libelf-dev libyaml-dev zip unzip python3

      - name: Clone Source Kernel & AnyKernel3
        run: |
          git clone --depth=1 https://github.com/mubashardev/android_kernel_xiaomi_earth_lineageos.git -b lineage-23.2 kernel-src
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3

      - name: Fix Missing KernelSU Kconfig
        run: |
          cd kernel-src
          # Hapus baris pemanggilan KernelSU agar tidak menanyakan file Kconfig yang hilang
          sed -i '/kernelsu/d' drivers/Kconfig || true

      - name: Configure Performance Tweak
        run: |
          cd kernel-src
          echo "CONFIG_CPU_FREQ_GOV_PERFORMANCE=y" >> arch/arm64/configs/earth_defconfig
          echo "CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y" >> arch/arm64/configs/earth_defconfig

      - name: Build Kernel
        run: |
          cd kernel-src
          export ARCH=arm64
          export SUBARCH=arm64
          export KCFLAGS="-w"

          make O=out earth_defconfig CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          make -j$(nproc --all) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

      - name: Package AnyKernel3 ZIP
        run: |
          cd kernel-src
          IMAGE_PATH=""
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            IMAGE_PATH="out/arch/arm64/boot/Image.gz-dtb"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            IMAGE_PATH="out/arch/arm64/boot/Image.gz"
          elif [ -f out/arch/arm64/boot/Image ]; then
            IMAGE_PATH="out/arch/arm64/boot/Image"
          fi

          if [ -n "$IMAGE_PATH" ]; then
            cp $IMAGE_PATH ../AK3/
            cd ../AK3
            zip -r9 ../Kernel-SafeOC-Earth.zip * -x .git README.md
          else
            echo "Error: Image file not found!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-SafeOC-Earth
          path: Kernel-SafeOC-Earth.zip
